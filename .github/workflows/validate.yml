name: Validate catalog

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      schema-url:
        description: URL of wisp.schema.json to validate against
        required: false
        default: https://raw.githubusercontent.com/wisp-hq/apps/main/wisp.schema.json
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install -g ajv-cli ajv-formats

      - name: Resolve schema
        env:
          SCHEMA_URL: ${{ inputs.schema-url || 'https://raw.githubusercontent.com/wisp-hq/apps/main/wisp.schema.json' }}
        run: |
          if [ -f wisp.schema.json ]; then
            echo "SCHEMA=$PWD/wisp.schema.json" >> "$GITHUB_ENV"
          else
            curl -sSfL "$SCHEMA_URL" -o /tmp/wisp.schema.json
            echo "SCHEMA=/tmp/wisp.schema.json" >> "$GITHUB_ENV"
          fi

      - name: Validate each wisp.json against schema
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          found=0
          for manifest in */wisp.json; do
            found=1
            echo "::group::$manifest"
            ajv validate --spec=draft2020 -s "$SCHEMA" -d "$manifest" --strict=false
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no */wisp.json files found"
            exit 1
          fi

      - name: Semantic checks
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f manifest.json ]; then
            echo "::error::manifest.json missing at repo root"
            exit 1
          fi

          version=$(jq -r '.schemaVersion' manifest.json)
          if [ "$version" != "1" ]; then
            echo "::error file=manifest.json::schemaVersion must be 1 (got $version)"
            exit 1
          fi

          manifest_apps=$(jq -r '.apps[]' manifest.json | sort -u)
          folder_apps=$(for d in */wisp.json; do dirname "$d"; done | sort -u)

          if [ "$manifest_apps" != "$folder_apps" ]; then
            echo "::error file=manifest.json::apps array does not match the folders containing a wisp.json"
            diff <(echo "$manifest_apps") <(echo "$folder_apps") || true
            exit 1
          fi

          fail=0
          while IFS= read -r slug; do
            file="$slug/wisp.json"
            actual_slug=$(jq -r '.slug' "$file")
            if [ "$actual_slug" != "$slug" ]; then
              echo "::error file=$file::slug '$actual_slug' does not match folder name '$slug'"
              fail=1
            fi
            icon=$(jq -r '.icon' "$file")
            if [ ! -f "$slug/$icon" ]; then
              echo "::error file=$file::icon path '$icon' does not resolve to an existing file"
              fail=1
            fi
          done <<< "$folder_apps"

          exit $fail
